



[theme]
format = 1
name = YoRHa
author = YKW4Recomp

layout = menu

base = yorha

[colors]

page = #DAD6BE
ink = #45413A
soft = #8A8676
focus = #45413A
active = #8A6A2A
failure = #A5473C
dim = #B4B09C
warning = #8A6A2A

added = #4A7040

[head]

style = plain
rule = true

place = tabs

size = 2
shadow = false

menu = YKW4Recomp  /  MENU
games = YKW4Recomp  /  GAMES
keys = YKW4Recomp  /  KEYS
compiling = COMPILING
loading = BOOTING

[body]

marker = "■ "

focus = bar

panels = fill

sizing = fixed

text = wrap

cursor = "► "

[backdrop]

grid = true

[tips]

place = top

box = true

wrap = false

[footer]

style = bar
rule = false

box = true

[run]

layout = steps
page = #141416
ink = #E6E4DC
soft = #8E8C86
dim = #3E3E40
failure = #D2463A

warning = #D9B24A

texture = true
bar = false

detailed = true
collapse = false

progress = percent

ring = right

[prompt]


align = center
open = "[ "
close = " ]"
blink = true

keys = true
done = false
failed = false
aborting = false

[transitions]


fade_in_ms = 250
fade_out_ms = 500

line_in = typing
line_in_ms = 220
typing_ms = 5


typing = sync
blink_ms = 500

scroll_ms = 120
[splash]


page = #DAD6BE
ms = 1000
chance = 25
